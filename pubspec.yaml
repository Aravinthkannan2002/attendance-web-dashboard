name: attendance_web_dashboard
description: Admin dashboard for the FaceAttend attendance management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State management and routing
  get: ^4.7.2

  # Supabase backend
  supabase_flutter: ^2.5.0

  # Charts
  fl_chart: ^0.69.0

  # Internationalisation / formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8
  toastification: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
